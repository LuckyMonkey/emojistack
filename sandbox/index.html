<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EmojiStack Sandbox</title>
    <link rel="stylesheet" href="../dist/emojistack.css">
    <link rel="stylesheet" href="../dist/emojistack-prefabs.css">
    <link rel="stylesheet" href="./sandbox.css">
  </head>
  <body>
    <div class="topbar">
      <a class="home-link topbar-link" href="../" title="Return to home" aria-label="Return to home">⌂</a>
      <div class="topbar-title">EmojiStack</div>
    </div>

    <div class="shell">
      <main class="workspace">
        <section class="panel picker-panel">
          <div class="picker-head">
            <input id="prefab-search" type="search" placeholder="Search prefabs" title="Search saved prefabs">
            <select id="prefab-jump" title="Pick a prefab to load"></select>
            <button id="duplicate-prefab" class="quiet-button" type="button" title="Duplicate the current prefab">Duplicate</button>
            <button id="save-prefab" type="button" title="Save this prefab to the sheet">Save</button>
            <button id="reset-button" class="quiet-button" type="button" title="Reset the current editor state">Reset</button>
          </div>
          <p id="status-line" class="status-line">Pick a prefab or build one.</p>
        </section>

        <section class="panel preview-panel">
          <div id="preview-stage" class="preview-stage">
            <div id="preview-hero" class="preview-hero" title="Drag the top emoji to place it">
              <i id="preview-main" class="es" title="Drag to place the top emoji"></i>
              <div class="preview-caption">
                <strong id="preview-title">Current stack</strong>
                <span id="preview-subtitle">Drag to place.</span>
              </div>
            </div>
            <button id="copy-class" class="copy-strip" type="button" title="Click to copy the class string">
              <span class="copy-label">Class</span>
              <code id="class-output">es</code>
            </button>
          </div>
        </section>

        <section class="panel controls-panel">
          <div class="controls-grid compact">
            <div class="field">
              <label for="base-select">Base</label>
              <select id="base-select"></select>
            </div>

            <div class="field">
              <label for="overlay-select">Top</label>
              <select id="overlay-select"></select>
            </div>

            <div class="field span-two">
              <div class="label-row">
                <label>Size</label>
                <span id="position-note" class="chip">Center</span>
              </div>
              <div class="picker-toggle" id="picker-mode-toggle">
                <button type="button" data-size-mode="small" title="Small">S</button>
                <button type="button" data-size-mode="medium" title="Medium">M</button>
                <button type="button" data-size-mode="large" title="Large">L</button>
              </div>
            </div>
          </div>

          <div class="field">
            <div class="label-row">
              <label>Position</label>
            </div>
            <div class="picker-shell">
              <div id="position-grid" class="position-board position-grid"></div>
            </div>
          </div>

          <div class="button-row compact-row">
            <button id="make-base-default" type="button" title="Save this placement as the default for the base emoji">Default this base</button>
            <button id="make-sub-default" type="button" title="Save this placement as the default for the sub emoji">Default this sub</button>
            <button id="clear-base-default" class="quiet-button" type="button" title="Remove the saved base default">Clear base</button>
            <button id="clear-sub-default" class="quiet-button" type="button" title="Remove the saved sub default">Clear sub</button>
          </div>
          <div id="base-default-note" class="inline-note">No base default saved for this emoji.</div>
          <div id="sub-default-note" class="inline-note">No sub default saved for this emoji.</div>
        </section>
      </main>
    </div>

    <script src="../dist/emojistack.js"></script>
    <script src="../config/prefab-api.js"></script>
    <script src="../shared/prefab-store.js"></script>
    <script src="./sandbox.js"></script>
  </body>
</html>
