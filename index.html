<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EmojiStack</title>
    <link rel="stylesheet" href="./dist/emojistack.css">
    <link rel="stylesheet" href="./dist/emojistack-prefabs.css">
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <a class="home-link topbar-link" href="./" title="EmojiStack home" aria-label="EmojiStack home">⌂</a>
        <div class="topbar-title">EmojiStack</div>
      </div>
      <section class="snap-section intro-section">
        <div class="intro-grid">
          <article class="readme-panel">
            <h1>Layer emoji into usable little icons.</h1>
            <div id="readme-content" class="readme-content"></div>
          </article>

          <aside class="roulette-panel">
            <div id="roulette-stage" class="roulette-stage" title="Click to stop and copy">
              <i id="roulette-icon" class="es p-strawberry-milk" title="Click to stop and copy"></i>
            </div>
            <div class="roulette-meta">
              <span id="roulette-note">Click the spinner to stop on one and copy it.</span>
            </div>
            <div class="snippet-block">
              <code id="roulette-copy" class="roulette-copy" title="Click to copy" data-copy="&lt;i class=&quot;es p-strawberry-milk&quot;&gt;&lt;/i&gt;">&lt;i class="es p-strawberry-milk"&gt;&lt;/i&gt;</code>
            </div>
            <div class="cta-row">
              <a class="cta-button" href="./sandbox/">Go to Sandbox</a>
              <a class="cta-button" href="./prefabs/">Go to Prefabs</a>
              <a class="cta-button" href="https://github.com/LuckyMonkey/emojistack" target="_blank" rel="noreferrer">Go to GitHub</a>
            </div>
          </aside>
        </div>
      </section>

      <div id="random-showcases"></div>
    </main>

    <script src="./dist/emojistack.js"></script>
    <script src="./config/prefab-api.js"></script>
    <script src="./shared/prefab-store.js"></script>
    <script src="./index.js"></script>
  </body>
  </html>
